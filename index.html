<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG'Imports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="btn-tema">🌙 Modo escuro</button>

    <h1>JG'Imports</h1>   
    <h2>Seja bem vindo à JG'Imports</h2>
    <img src="logotipo.png" alt="">

    <section>
        <h3>Sobre nós</h3>
        <p>A JG'Imports trabalha com importação de produtos, oferecendo qualidade e agilidade para nossos clientes.</p>
    </section>

    <section>
        <h3>Contato</h3>
        <p>Email: jorge.salla@escola.pr.gov.br</p>
        <p>WhatsApp: (49) 98423-1329</p>
    </section>

    <footer>
        <p>&copy; 2026 JG'Imports. Todos os direitos reservados.</p>
    </footer>

    <script>
        const btn = document.getElementById('btn-tema');

        btn.addEventListener('click', () => {
            document.body.classList.toggle('escuro');

            if (document.body.classList.contains('escuro')) {
                btn.textContent = '☀️ ';
            } else {
                btn.textContent = '🌙 ';
            }
        });
    </script>

</body>
</html>
